# Local development stack. NOT for production: credentials below are development-only placeholders.
# Usage: docker compose -f infra/docker-compose.yml up --build
name: qs-intelligence
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_PASSWORD: postgres-dev-only
      PGUSER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qs-dev
      MINIO_ROOT_PASSWORD: qs-dev-only-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      QS_MIGRATION_DATABASE_URL: postgresql+psycopg://qs_owner:qs_owner_dev@postgres:5432/qs_dev
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ../backend
    environment:
      QS_ENVIRONMENT: development
      QS_DATABASE_URL: postgresql+psycopg://qs_app:qs_app_dev@postgres:5432/qs_dev
      QS_REDIS_URL: redis://redis:6379/0
      QS_STORAGE_BACKEND: s3
      QS_S3_BUCKET: qs-documents
      QS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: qs-dev
      AWS_SECRET_ACCESS_KEY: qs-dev-only-password
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports: ["8000:8000"]

  web:
    build:
      context: ../frontend
      args: { QS_API_ORIGIN: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
