[project]
name = "qs-intelligence-api"
version = "0.1.0"
description = "QS Intelligence USA - AI Commercial Operating System for Construction (API)"
requires-python = ">=3.12"
# Runtime dependencies are pinned exactly. See docs/DECISION_LOG.md (ADR-012) for the upgrade policy.
dependencies = [
  "fastapi==0.163.2",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "email-validator==2.4.0",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "uvicorn[standard]==0.54.0",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "pyotp==2.12.0",
  "cryptography==50.0.2",
  "redis==8.1.0",
  "boto3==1.44.5",
  "python-multipart==0.0.34",
  "filetype==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.5",
  "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "E501"]
# Frozen migration SQL is assembled only from module constants and a validated role identifier.
"alembic_helpers/*" = ["S608"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
